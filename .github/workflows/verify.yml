name: verify

# The definition of done (AGENTS.md): the full verification loop, split into five parallel jobs on free
# ubuntu-latest runners (1 fast + 2 e2e shards + 2 visual shards), rolled up into a single `verify`
# status check required by the Main protection ruleset. Visual checks run directly inside
# Playwright's official container image — the same image developers use locally via Docker — so pixels agree
# without nested Docker or a WebSocket tunnel.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_app: ${{ steps.filter.outputs.run_app }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Check whether app verification is needed
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run_app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              docs/*|shell/*|website/*|.agents/*|.claude/*|.github/workflows/docs.yml|*.md) ;;
              *)
                echo "run_app=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          done <<< "$changed"
          echo "run_app=false" >> "$GITHUB_OUTPUT"

  fast:
    name: fast
    needs: changes
    if: needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      # Cache ESLint on PRs only so pushes to main always run a full uncached type-checked lint pass.
      - name: Cache ESLint results
        if: github.event_name == 'pull_request'
        uses: actions/cache@v6
        with:
          path: app/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/eslint.config.js', 'app/eslint-rules/**', 'app/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/eslint.config.js', 'app/eslint-rules/**', 'app/tsconfig*.json') }}-

      - run: npm ci

      - name: Run non-browser verification steps
        env:
          VERIFY_JOBS: "2"
        run: npm run verify -- --skip test:e2e,test:visual

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-fast-failure
          path: app/.tmp/verify-*
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Vite dependency pre-bundle
        uses: actions/cache@v6
        with:
          path: app/.tmp/vite-cache-e2e
          key: vite-cache-e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            vite-cache-e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}-

      - name: Run end-to-end suite (shard ${{ matrix.shard }}/2)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-e2e-shard-${{ matrix.shard }}-failure
          path: app/.tmp/e2e-results
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.run_app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Cache Vite dependency pre-bundle
        uses: actions/cache@v6
        with:
          path: app/.tmp/vite-cache-e2e
          key: vite-cache-e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}-${{ github.sha }}
          restore-keys: |
            vite-cache-e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}-

      - name: Run visual reference comparison (shard ${{ matrix.shard }}/2)
        env:
          VISUAL_IN_CONTAINER: "1"
        run: npm run test:visual -- --shard=${{ matrix.shard }}/2

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-visual-shard-${{ matrix.shard }}-failure
          path: app/.screenshots/diffs
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, fast, e2e, visual]
    if: always()
    steps:
      - name: Check required verification results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_APP: ${{ needs.changes.outputs.run_app }}
          FAST_RESULT: ${{ needs.fast.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_app=$RUN_APP fast=$FAST_RESULT e2e=$E2E_RESULT visual=$VISUAL_RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "changes job did not succeed: $CHANGES_RESULT"
            exit 1
          fi
          if [ "$RUN_APP" != "true" ]; then
            echo "Only non-app paths changed; app verification skipped."
            exit 0
          fi
          for pair in "fast=$FAST_RESULT" "e2e=$E2E_RESULT" "visual=$VISUAL_RESULT"; do
            if [ "${pair#*=}" != "success" ]; then
              echo "Required job failed: $pair"
              exit 1
            fi
          done
