name: verify

# The definition of done (AGENTS.md): the full verification loop, split into five parallel jobs on free
# ubuntu-latest runners (1 fast + 2 e2e shards + 2 visual shards). Visual checks run directly inside
# Playwright's official container image — the same image developers use locally via Docker — so pixels agree
# without nested Docker or a WebSocket tunnel.
on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "shell/**"
      - ".agents/**"
      - ".claude/**"

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache ESLint results
        uses: actions/cache@v6
        with:
          path: app/.eslintcache
          key: eslint-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/eslint.config.js', 'app/eslint-rules/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/eslint.config.js', 'app/eslint-rules/**') }}-

      - run: npm ci

      - name: Run non-browser verification steps
        env:
          VERIFY_JOBS: "2"
        run: npm run verify -- --skip test:e2e,test:visual

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-fast-failure
          path: app/.tmp/verify-*
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p 'require("./node_modules/@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium and system dependencies
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Vite dependency pre-bundle
        uses: actions/cache@v6
        with:
          path: app/.tmp/vite-cache-e2e
          key: vite-cache-e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}

      - name: Run end-to-end suite (shard ${{ matrix.shard }}/2)
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/2

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-e2e-shard-${{ matrix.shard }}-failure
          path: app/.tmp/run-*
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: visual (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Cache Vite dependency pre-bundle
        uses: actions/cache@v6
        with:
          path: app/.tmp/vite-cache-e2e
          key: vite-cache-e2e-${{ runner.os }}-${{ hashFiles('app/package-lock.json', 'app/vite.config.ts') }}

      - name: Run visual reference comparison (shard ${{ matrix.shard }}/2)
        env:
          VISUAL_IN_CONTAINER: "1"
        run: npm run test:visual -- --shard=${{ matrix.shard }}/2

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-visual-shard-${{ matrix.shard }}-failure
          path: app/.screenshots/diffs
          if-no-files-found: ignore
          retention-days: 7
