name: verify

# The definition of done (AGENTS.md): `npm run verify`, including the reference-screenshot comparison, which
# renders in Playwright's Docker image on this runner. The same command, the same image, the same pixels
# as on a developer machine.
on:
  push:
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: app/.node-version
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # The local Chromium that the end-to-end suite uses (the screenshots run in Docker).
      - run: npx playwright install --with-deps chromium

      - run: npm run verify

      - name: Keep the evidence of a failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-failure
          path: |
            app/.screenshots/diffs
            app/.tmp/verify-*
          if-no-files-found: ignore
          retention-days: 7
